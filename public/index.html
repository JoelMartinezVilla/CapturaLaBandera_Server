<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbs of Aegir</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        *{
            margin: 0;
            padding: 0;
            font-family: "Montserrat", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(250, 241, 255);
        }

        #content{
            width: fit-content;
            padding: 5rem;
            display: flex;
            gap: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background-color: white;
            border: 1px solid lightgray;
            border-radius: 0.5rem;
        }
        #title-content {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .see-game {
            text-decoration: none;
            color: white;
            padding: 1rem;
            background-color: blueviolet;
            border-radius: 0.5rem;
        }

        .see-game:hover {
            background-color: rgb(154, 83, 220);
        }

        .download-apk {
            text-decoration: none;
            color: white;
            padding: 1rem;
            background-color: rgb(255, 102, 0);
            border-radius: 0.5rem;
        }
        .download-apk:hover {
            background-color: rgb(255, 162, 100);
        }

        #title-content > h1 {
            font-size: 80px;
            color: rgb(46, 14, 76);
            font-family: "VT323";
        }
        #title-content > h3 {
            font-weight: normal;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div id="content">
        <div id="title-content">
            <h1>Orbs of Aegir</h1>
            <h3>Escaneja el codi QR per descarregar l'última versió!</h3>
        </div>
        <img src="qr.png" alt="Código QR para descargar el APK" />
        
        <div class="buttons">
            <a class="download-apk" href="https://bandera4.ieti.site/android-debug.apk">Descarregar .apk</a>
            <a class="see-game" href="https://bandera4.ieti.site/web/" target="_blank" rel="noopener">Veure partida</a>
        </div>
        
    </div>
    
</body>
</html>
